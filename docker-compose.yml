services:
  netrek3d:
    build: .
    container_name: netrek3d
    ports:
      - "9702:9702"
    restart: unless-stopped
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9702/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
